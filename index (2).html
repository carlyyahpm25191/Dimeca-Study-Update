function end(){const c=Q.ok*(Q.pl?4:3)+(Q.ok==Q.n?10:0),st=Math.round(Q.ok/Q.n*3);U.c+=c;U.pt=(U.pt||0)+Q.ok;save();snd.win();if(Q.on)return fin(c);if(Q.pl&&Q.vs)return endVs(c);
app.innerHTML=`<div class="card c"><h1>${['😢','🙂','😃','🏆'][st]} ¡Terminaste!</h1><p class="big2">${'⭐'.repeat(st)||'💪'}</p><p>Aciertos: <b>${Q.ok}/${Q.n}</b></p><p>Ganaste <b>🪙 ${c}</b> monedas (tienes ${U.c})</p><div class="row" style="justify-content:center"><button class="on" onclick="begin2(Q)">🔁 Otra vez</button><button onclick="dress()">👗 Gastar monedas</button><button onclick="home()">🏠 Menú</button></div></div>`}

/* vestuario */
function dress(){A={...DA,...U.av};tab='sp';edit()}
function edit(){const cf=CF[tab],pal=tab=='sp'?SK:PAL;
app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><button onclick="home()">⬅️ Menú</button><b>🪙 ${U.c}</b></div><div class="row" style="align-items:flex-start;justify-content:center"><div class="c">${av(A,230)}<div><button onclick="rnd()">🎲 Sorpresa</button></div></div><div style="flex:1;min-width:260px"><div class="row">${TB.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';edit()">${t[1]}</button>`).join('')}</div><p>Estilo (🔒 = se compra con monedas):</p><div class="row">${IT[tab].map((n,i)=>{const lk=CO[tab][i]&&!U.own.includes(tab+i);return`<button class="chip ${A[tab]==i?'on':''} ${lk?'lk':''}" onclick="pick(${i})">${n}${lk?' 🔒'+CO[tab][i]:''}</button>`}).join('')}</div><p>Color:</p><div class="row">${pal.map(c=>`<button class="sw" style="background:${c}" onclick="A.${cf}='${c}';snd.cl();edit()"></button>`).join('')}<input type="color" value="${/^#[0-9a-f]{6}$/i.test(A[cf])?A[cf]:'#ff5fa2'}" oninput="A.${cf}=this.value" onchange="edit()" style="width:44px;height:36px;padding:0;margin:0" title="Color a tu gusto"></div></div></div><button class="big" onclick="keep()">💾 Guardar mi skin</button></div>`}
function pick(i){const k=tab+i,c=CO[tab][i];if(c&&!U.own.includes(k)){if(U.c<c)return toast(`Necesitas 🪙 ${c}. ¡Juega para ganar monedas!`);U.c-=c;U.own.push(k);save();toast('¡Desbloqueado! 🎉');snd.win()}else snd.cl();A[tab]=i;edit()}
function rnd(){for(const t in IT){const ok=IT[t].map((_,i)=>i).filter(i=>!CO[t][i]||U.own.includes(t+i));A[t]=pk(ok);A[CF[t]]=pk(t=='sp'?SK:PAL)}snd.cl();edit()}
function keep(){U.av={...A};save();snd.win();toast('¡Skin guardada! 💖');home()}

/* nube y multijugador (db) */
let DB=null,UID=null,ROOM=null,unsubs=[];
const unw=()=>{unsubs.forEach(f=>f());unsubs=[]},pd=()=>DB.doc('rooms/'+ROOM.c+'/pl/'+UID),cloudSave=()=>DB.doc('data/users/'+UID+'/p').set(U).catch(()=>toast('No se pudo guardar en la nube 😕'));
async function boot(){let ok=0;app.innerHTML='<div class="card c"><h1 class="logo">DIMECA STUDY</h1><p>Cargando tu sesión ☁️…</p></div>';
try{if(typeof claude!='undefined'){const[d,us]=await Promise.race([Promise.all([claude.use('db'),claude.use('user')]),new Promise((_,j)=>setTimeout(j,8000))]);
if(d&&us){const id=await us.id();if(id){const me=await us.me(),g=await d.doc('data/users/'+id+'/p').get();DB=d;UID=id;U={e:id,u:me.name||'Jugador',c:20,own:[],av:{},th:'sakura',pt:0,...(g.exists?g.data():{})};U.av={...DA,...U.av};if(!g.exists)save();ok=1;document.documentElement.dataset.t=U.th;g.exists?home():dress()}}}}catch(e){DB=null}
if(!ok){const s=ld('dm_s',null)||(()=>{try{return sessionStorage.getItem('dm_s')}catch(e){}})();s&&users()[s]?begin(s,true):auth()}}
async function mkRoom(vs){try{const c=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[R(0,23)]).join(''),qs=Array.from({length:8},()=>{const q=mixg();return{q:q.q,o:q.o,a:q.a,say:q.say||null,after:q.after||0}});
await DB.doc('rooms/'+c).set({host:UID,vs:vs?1:0,st:'lobby',qs:JSON.stringify(qs),at:Date.now()});join(c)}catch(e){toast('No se pudo crear la sala 😕')}}
async function join(c){c=(c||'').trim().toUpperCase();if(c.length!=4)return toast('El código tiene 4 letras');
try{const r=await DB.doc('rooms/'+c).get();if(!r.exists)return toast('No encontré esa sala 🙈');const d=r.data();ROOM={c,host:d.host,vs:d.vs,st:d.st,qs:JSON.parse(d.qs),pl:{},view:'lobby'};
await pd().set({n:U.u,av:U.av,ok:0,i:0,ms:0,dn:0});watch();lobby()}catch(e){ROOM=null;toast('No pude entrar a la sala 😕')}}
function watch(){unw();unsubs=[DB.doc('rooms/'+ROOM.c).onSnapshot(s=>{if(ROOM&&s.exists){ROOM.st=s.data().st;paint()}}),DB.collection('rooms/'+ROOM.c+'/pl').onSnapshot(s=>{if(!ROOM)return;ROOM.pl={};s.docs.forEach(x=>ROOM.pl[x.id]=x.data());paint()})]}
function paint(){if(!ROOM)return;const v=ROOM.view;if(v=='lobby')ROOM.st=='play'?playO():lobby();else if(v=='play'){const e=$('#sb');if(e)e.innerHTML=sb()}else if(v=='end')results()}
function lobby(){const ps=Object.entries(ROOM.pl);app.innerHTML=`<div class="card c"><div class="row" style="justify-content:space-between"><button onclick="home()">⬅️</button><b>${ROOM.vs?'⚔️ Competencia':'🤝 En equipo'}</b></div><h2>Código de sala</h2><div class="big2" style="letter-spacing:8px"><b>${ROOM.c}</b></div><p>Pásale este código a tu amigo 📲 (puede usar otro dispositivo)</p><div class="row" style="justify-content:center">${ps.map(([id,p])=>`<div class="c">${av(p.av,70)}<div>${esc(p.n||'?')}${id==UID?' (tú)':''}</div></div>`).join('')}</div>${ROOM.host==UID?'<button class="big" onclick="startR()">▶️ ¡Empezar!</button>':'<p>Esperando al anfitrión… ⏳</p>'}</div>`}
async function startR(){try{await DB.doc('rooms/'+ROOM.c).update({st:'play'})}catch(e){toast('No se pudo empezar 😕')}}
function playO(){ROOM.view='play';Q={g:()=>ROOM.qs[Q.i],n:ROOM.qs.length,i:0,ok:0,t:0,on:1,t0:Date.now()};ask()}
const sb=()=>{const ps=Object.entries(ROOM.pl);return ROOM.vs?ps.sort((a,b)=>b[1].ok-a[1].ok||a[1].ms-b[1].ms).map(([id,p])=>`<span>${id==UID?'👉':''}${esc(p.n||'?')}: ⭐${p.ok} (${p.i}/${Q.n})</span>`).join(' · '):`<b>🤝 Equipo: ⭐ ${ps.reduce((t,[,p])=>t+p.ok,0)}</b>`};
function fin(c){ROOM.view='end';ROOM.c2=c;pd().update({dn:1,ok:Q.ok,ms:Date.now()-Q.t0}).catch(()=>{});results()}
function results(){const ps=Object.entries(ROOM.pl),all=ps.every(([,p])=>p.dn),t=ps.reduce((s,[,p])=>s+p.ok,0),r=[...ps].sort((a,b)=>b[1].ok-a[1].ok||a[1].ms-b[1].ms);
if(ROOM.vs&&all&&r[0][0]==UID&&!ROOM.b){ROOM.b=1;U.c+=10;save();toast('¡Ganaste! +🪙 10 🏆')}
app.innerHTML=`<div class="card c"><h1>${ROOM.vs?'⚔️ Resultados':'🤝 Resultado del equipo'}</h1>${ROOM.vs?r.map(([id,p],i)=>`<p class="big2">${['🥇','🥈','🥉'][i]||'🎖️'} ${esc(p.n||'?')}${id==UID?' (tú)':''}: ⭐ ${p.ok}/${Q.n}${p.dn?'':' ⏳'}</p>`).join(''):`<p class="big2">⭐ ${t} / ${ps.length*Q.n}</p><p>${ps.map(([,p])=>esc(p.n||'?')+' '+p.ok).join(' · ')}</p>`}${all?'':'<p>Esperando a los demás… ⏳</p>'}<p>Ganaste <b>🪙 ${ROOM.c2}</b> (tienes ${U.c})</p><button class="on" onclick="home()">🏠 Menú</button></div>`}
const endVs=c=>{app.innerHTML=`<div class="card c"><h1>🏆 ¡Terminó!</h1>${Q.pl.map((n,i)=>`<p class="big2">${esc(n)}: ⭐ ${Q.sc[i]}</p>`).join('')}<p><b>${Q.sc[0]==Q.sc[1]?'¡Empate! 🤝':'¡Gana '+esc(Q.pl[Q.sc[0]>Q.sc[1]?0:1])+'! 🎉'}</b></p><p>🪙 +${c}</p><button class="on" onclick="home()">🏠 Menú</button></div>`};
boot();
</script></body></html>
